# GRUB de la clé USB SecMet : démarre le système live depuis la partition
# SECMET-SYS (live-boot), sans menu visible. Maintenir Échap pour le menu.
set default=0
set timeout=2
set timeout_style=hidden
search --no-floppy --label SECMET-SYS --set=root
insmod all_video
insmod gfxterm
terminal_output gfxterm

# Entrée par défaut : la racine reste sur la clé (squashfs monté en loop,
# lu à la demande, overlay en RAM pour les écritures). Démarrage le plus
# court ; la clé doit rester branchée pendant toute la session. La veille du
# dé-frozen fonctionne avec la racine sur la clé (vérifié 2026-11-05, HP
# ProBook 455 G3) : le gel au réveil du 2026-11-02 venait de nomodeset, pas
# de la clé.
menuentry "SecMet" {
    linux /live/vmlinuz boot=live live-media-path=/live quiet splash net.ifnames=0
    initrd /live/initrd.img
}
# toram=filesystem.squashfs : le squashfs (≈ 725 Mo) est copié en mémoire au
# démarrage, puis la clé ne sert plus. Compter 4 Go de RAM et 25 à 40 s de
# plus derrière l'écran de démarrage (message « Copie du système en
# mémoire ») ; utile si un poste perd la clé pendant la veille ou pour
# retirer la clé une fois la session ouverte.
menuentry "SecMet (copie en mémoire, clé retirable ensuite, 4 Go de RAM)" {
    linux /live/vmlinuz boot=live live-media-path=/live toram=filesystem.squashfs quiet splash net.ifnames=0
    initrd /live/initrd.img
}
menuentry "SecMet (mode sans échec graphique)" {
    linux /live/vmlinuz boot=live live-media-path=/live nomodeset
    initrd /live/initrd.img
}
menuentry "SecMet (console de dépannage)" {
    linux /live/vmlinuz boot=live live-media-path=/live systemd.unit=multi-user.target
    initrd /live/initrd.img
}
