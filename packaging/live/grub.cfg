# GRUB de la clé USB SecMet : démarre le système live depuis la partition
# SECMET-SYS (live-boot), sans menu visible. Maintenir Échap pour le menu.
set default=0
set timeout=2
set timeout_style=hidden
search --no-floppy --label SECMET-SYS --set=root
insmod all_video
insmod gfxterm
terminal_output gfxterm

# toram=filesystem.squashfs : seul le système (squashfs) est copié en mémoire
# au démarrage (« toram » seul copiait toute la partition, noyau et initrd
# compris) ; la clé USB ne porte plus la racine, donc une mise en veille
# (dé-frozen) qui coupe le contrôleur USB ne fige plus le système au réveil.
# Cette copie est la phase muette derrière l'écran de démarrage : 30 à 40 s
# sur une clé à 25 Mo/s. Compter 4 Go de RAM ; l'entrée « sans copie en
# mémoire » démarre bien plus vite et sert aux postes plus petits.
menuentry "SecMet" {
    linux /live/vmlinuz boot=live live-media-path=/live toram=filesystem.squashfs quiet splash net.ifnames=0
    initrd /live/initrd.img
}
menuentry "SecMet (sans copie en mémoire, moins de 4 Go de RAM)" {
    linux /live/vmlinuz boot=live live-media-path=/live quiet splash net.ifnames=0
    initrd /live/initrd.img
}
menuentry "SecMet (mode sans échec graphique)" {
    linux /live/vmlinuz boot=live live-media-path=/live toram=filesystem.squashfs nomodeset
    initrd /live/initrd.img
}
menuentry "SecMet (console de dépannage)" {
    linux /live/vmlinuz boot=live live-media-path=/live systemd.unit=multi-user.target
    initrd /live/initrd.img
}
