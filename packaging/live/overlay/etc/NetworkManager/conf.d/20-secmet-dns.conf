# SecMet : la clé n'embarque pas systemd-resolved. NetworkManager écrit
# donc lui-même /etc/resolv.conf avec les serveurs DNS reçus par DHCP. Sans
# ce fichier, une configuration dns=systemd-resolved (celle du paquet
# Ubuntu, où l'image a d'abord été construite) ne les transmettait à
# personne et aucune résolution de nom ne fonctionnait (« Dns Failed » à la
# vérification des mises à jour).
[main]
dns=default
rc-manager=file
