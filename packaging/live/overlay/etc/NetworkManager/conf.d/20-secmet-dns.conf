# SecMet : la clé n'embarque pas systemd-resolved, alors que le paquet Ubuntu
# de NetworkManager impose dns=systemd-resolved (10-dns-resolved.conf) ; sans
# ce fichier, les serveurs DNS reçus par DHCP ne sont transmis à personne et
# aucune résolution de nom ne fonctionne (« Dns Failed » à la vérification des
# mises à jour). NetworkManager écrit donc lui-même /etc/resolv.conf.
[main]
dns=default
rc-manager=file
