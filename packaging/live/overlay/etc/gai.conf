# SecMet (clé live) : IPv4 d'abord dans getaddrinfo(3).
#
# Sur un réseau d'atelier qui annonce une route IPv6 sans connectivité
# réelle, les connexions essaient d'abord l'adresse IPv6, attendent le
# délai d'expiration, puis seulement l'IPv4 : vérification des mises à
# jour en échec (« Network Error »), synchronisation NTP retardée
# (observé sur un EliteBook 850 G3 le 3 novembre 2026). La priorité
# IPv4 évite l'attente ; IPv6 reste utilisable si aucune adresse IPv4
# n'existe.
label  ::1/128       0
label  ::/0          1
label  2002::/16     2
label  ::/96         3
label  ::ffff:0:0/96 4
label  fec0::/10     5
label  fc00::/7      6
label  2001:0::/32   7
precedence  ::1/128       50
precedence  ::/0          40
precedence  2002::/16     30
precedence  ::/96         20
precedence  ::ffff:0:0/96 100
