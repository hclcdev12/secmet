# Clé SecMet : fermer le capot ou laisser le poste inactif ne doit jamais
# le mettre en veille pendant un effacement. La veille volontaire
# (Dé-frozen) reste possible par « systemctl suspend ».
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
