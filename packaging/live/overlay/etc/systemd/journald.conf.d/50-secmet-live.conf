# Clé SecMet : journal en mémoire (Storage=volatile). Un journal persistant
# écrit par projection mémoire sur une clé USB lente bloquait journald
# jusqu'à 40 s à l'extinction (« Waiting for process: systemd-journal »).
# Les messages sont recopiés en texte sur la partition de données par
# secmet-journal-save (toutes les minutes, avant la veille, à l'extinction).
[Journal]
Storage=volatile
RuntimeMaxUse=64M
