# Clé SecMet : la partition de données est une clé USB lente. Sans ces
# limites, le noyau accumule des dizaines de Mo d'écritures en attente, puis
# les vide d'un coup à la veille (« Filesystems sync ») et à l'extinction
# (« Syncing filesystems ») : 5 à 20 s d'attente. Ici, l'écriture part
# presque au fil de l'eau.
vm.dirty_background_bytes = 2097152
vm.dirty_bytes = 8388608
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 200
