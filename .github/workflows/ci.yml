name: CI

# Intégration continue : format, clippy strict, tests, audit des dépendances,
# licences des dépendances, syntaxe des scripts. Tourne sur main.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + tests (Ubuntu 24.04, GTK 4.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libglib2.0-dev \
            pkexec testdisk

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, toutes cibles, warnings interdits)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Crates sans GTK (helper, device, core, attest) testées seules
        run: cargo test -p secmet-helper -p secmet-device -p secmet-core -p secmet-attest

      - name: "secmet-verify : options et codes de retour"
        run: |
          cargo build --release -p secmet-attest --bin secmet-verify
          ./target/release/secmet-verify --help >/dev/null
          if ./target/release/secmet-verify --option-inconnue 2>/dev/null; then
            echo "une option inconnue doit être refusée" >&2; exit 1
          fi

  scripts:
    name: Scripts shell (syntaxe + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bits d'exécution (un script ou un crochet non exécutable est ignoré en silence)
        run: |
          for f in scripts/*.sh packaging/*.sh packaging/tests/*.sh packaging/live/*.sh packaging/live/tests/*.sh \
                   packaging/live/overlay/usr/local/bin/* packaging/live/overlay/etc/initramfs-tools/hooks/* \
                   packaging/live/overlay/usr/lib/systemd/system-sleep/*; do
            test -x "$f" || { echo "non exécutable : $f"; exit 1; }
          done
      - name: Syntaxe bash
        run: |
          for f in scripts/*.sh packaging/*.sh packaging/tests/*.sh packaging/live/*.sh packaging/live/tests/*.sh; do bash -n "$f"; done
          for f in packaging/live/overlay/usr/local/bin/*; do sh -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh packaging/*.sh packaging/tests/*.sh packaging/live/*.sh packaging/live/tests/*.sh
          shellcheck -S warning -s sh packaging/live/overlay/usr/local/bin/*
      - name: Scripts de démarrage de la clé (doublures)
        run: |
          ./packaging/live/tests/app-update.sh
          ./packaging/live/tests/image-check.sh
      - name: Documentation installée (install-docs.sh, contrôle et cas refusés)
        run: ./packaging/tests/install-docs.sh

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@cdd500fcb345d29dabc5617aab1edf24d5211116 # cargo-audit
      - name: cargo audit
        run: cargo audit

  licenses:
    name: Licences des dépendances (cargo-deny, avis cargo-about à jour)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Versions épinglées : la sortie de cargo-about en dépend
      # (ABOUT_VERSION de packaging/licenses/generate.sh).
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-deny@0.22.0,cargo-about@0.9.3
      - name: cargo deny check licenses (toutes les crates du dépôt, 3 cibles)
        run: cargo deny --workspace --locked check licenses
      - name: Avis de licences tierces à jour et complets (packaging/licenses)
        run: ./packaging/licenses/generate.sh --check

  fuzz-build:
    name: Cibles de fuzz compilables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - name: cargo check des cibles de fuzz (stable, sans instrumentation)
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
