name: Package

# Construit les livrables : .deb pour Ubuntu 24.04 et 22.04 (et dérivés :
# Mint 22 / 21), .rpm Fedora, AppImage (assemblée dans Ubuntu 24.04).
# Chaque paquet est installé et fumé dans son conteneur, à chaque push sur
# main et sur les pull requests touchant le packaging. Sur un tag vX.Y.Z
# (ou à la main avec ce tag), le dernier travail renomme les paquets selon
# la convention GitHub (« ~ » → « . »), signe SHA256SUMS et latest.json avec
# la clé de version, puis crée la release GitHub dans ce dépôt.
#
# Sur un tag ou à la main, la clé USB est publiée avec les paquets sous deux
# formes signées : le livrable de fabrication secmet-live_<version>_x86_64.tar
# (image, secmet-make-key.sh, secmet-release) et l'image prête à écrire
# secmet-key_<version>_x86_64.img.xz (Imager, Rufus, dd ;
# docs/Fabriquer_sa_cle.md). Deux cadences (packaging/live/live-mode.sh) :
#   - si un fichier du système de la clé a changé depuis la release
#     précédente, le travail « live » reconstruit l'image (conteneur
#     privilégié, 14 min) ;
#   - sinon « publish » reprend l'image de la release précédente (vérifiée
#     avec la clé de version) et refait seulement sa partition de données,
#     avec le nouveau .deb dans app/<version>/ signé : la clé le déploie au
#     démarrage (packaging/live/refresh_live.sh, quelques minutes).
#   full_live (à la main) impose la reconstruction (base Ubuntu rafraîchie).
#
# Secret du dépôt : SECMET_RELEASE_KEY (clé de version Ed25519, 64 hex). Les
# journaux sont publics : aucune étape n'affiche le secret.

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: ["main"]
    paths:
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publier à nouveau un tag déjà poussé (ex. v0.3.6) ; vide : construction seule"
        required: false
        type: string
      full_live:
        description: "Reconstruire le système de la clé USB même s'il n'a pas changé"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  SECMET_FORCE_BUILD: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Clé publique de version : ce que la clé USB (secmet-app-update) et
  # l'application acceptent ; sert à vérifier la release précédente reprise.
  SECMET_TRUST: bde3e3d9de271f8de9bb26c8dd4ed73f4c7344e309ebac7c3dffd50e02ca3bd5

permissions:
  contents: write

jobs:
  deb:
    name: .deb ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            version: "24.04"
          - distro: ubuntu22.04
            version: "22.04"
    steps:
      - name: Dépendances de construction
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git \
            libgtk-4-dev libglib2.0-dev policykit-1 testdisk \
            dpkg-dev fakeroot

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}

      - name: Construction du paquet
        env:
          SECMET_DEB_DISTRO: ${{ matrix.distro }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./packaging/build_deb.sh
          ls -la dist/

      - name: Installation et fumée
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/secmet_*.deb
          dpkg -s secmet | grep -E '^(Version|Depends)'
          secmet-verify --help >/dev/null
          secmet-helper 2>/dev/null && exit 1 || test $? -eq 2
          test -x /usr/lib/secmet/bin/testdisk
          test -f /usr/share/polkit-1/actions/secmet.policy

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: .rpm Fedora ${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["42"]
    steps:
      - name: Dépendances de construction
        run: |
          dnf install -y \
            gcc make pkgconf-pkg-config curl ca-certificates git \
            gtk4-devel glib2-devel polkit testdisk \
            rpm-build rpmdevtools

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: fedora${{ matrix.version }}

      - name: Construction du paquet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./packaging/build_rpm.sh
          ls -la dist/

      - name: Installation et fumée
        run: |
          dnf install -y dist/secmet-*.rpm
          rpm -q secmet
          secmet-verify --help >/dev/null
          secmet-helper 2>/dev/null && exit 1 || test $? -eq 2
          test -x /usr/lib/secmet/bin/testdisk
          test -f /usr/share/polkit-1/actions/secmet.policy

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora${{ matrix.version }}
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage (conteneur Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction (docker)
        run: |
          ./packaging/build_appimage.sh
          ls -la dist/

      - name: Fumée (extraction sans FUSE, glibc requise)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/dist/SecMet_*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/secmet
          test -x squashfs-root/usr/bin/secmet-helper
          max=$(objdump -T squashfs-root/usr/lib/libgtk-4.so.1 | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc max requise par libgtk-4 : $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  key-writer:
    name: SecMet Clé USB (AppImage, conteneur Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction (docker)
        run: |
          ./packaging/build_key_writer_appimage.sh
          ls -la dist/

      - name: Fumée (extraction sans FUSE, glibc requise, --version)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/dist/secmet-key-writer_*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/secmet-key-writer
          max=$(objdump -T squashfs-root/usr/bin/secmet-key-writer | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc max requise : $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39
          squashfs-root/usr/bin/secmet-key-writer --version

      - uses: actions/upload-artifact@v4
        with:
          name: key-writer
          path: dist/secmet-key-writer_*.AppImage
          if-no-files-found: error

  live-mode:
    name: Cadence de l'image de la clé USB
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      previous: ${{ steps.mode.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Système de la clé inchangé depuis la release précédente ?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          SECMET_RELEASES_REPO: ${{ github.repository }}
          # Construction seule (à la main sans tag) : rien à reprendre.
          SECMET_LIVE_FULL: ${{ (inputs.full_live || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) && '1' || '0' }}
        run: |
          line="$(./packaging/live/live-mode.sh)"
          echo "$line"
          mode="${line#mode=}"; mode="${mode%% *}"
          previous="$(sed -n 's/.*previous=\(v[0-9.]*\).*/\1/p' <<<"$line")"
          { echo "mode=$mode"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"

  live:
    name: Image de la clé USB (conteneur privilégié)
    needs: live-mode
    if: needs.live-mode.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Place disque (outils inutiles du runner)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction de l'image (docker --privileged)
        env:
          SECMET_ENGINE: docker
        run: |
          ./packaging/live/build_live.sh
          cat dist/live/VERSION
          ls -la dist/live/

      - name: Livrable de la clé USB
        run: |
          ./packaging/live/bundle_live.sh
          tar -tf dist/secmet-live_*_x86_64.tar | grep -E 'filesystem.squashfs|secmet-make-key.sh|secmet-release$'

      - name: Script de mise à jour au démarrage (doublures)
        run: ./packaging/live/tests/app-update.sh

      - name: Image publiable de la clé (.img.xz, Imager / Rufus / dd)
        env:
          SECMET_ENGINE: docker
        run: |
          ./packaging/live/make_key_image.sh --dist
          ls -la dist/secmet-key_*_x86_64.img.xz
          xz -l dist/secmet-key_*_x86_64.img.xz

      - uses: actions/upload-artifact@v4
        with:
          name: live
          path: |
            dist/secmet-live_*_x86_64.tar
            dist/secmet-key_*_x86_64.img.xz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Signature et release GitHub
    # « live » est sauté quand l'image est reprise : on attend chaque travail
    # explicitement plutôt que de laisser le saut se propager.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && needs.deb.result == 'success' && needs.rpm.result == 'success' && needs.appimage.result == 'success' && needs.key-writer.result == 'success' && needs.live-mode.result == 'success' && (needs.live.result == 'success' || (needs.live.result == 'skipped' && needs.live-mode.outputs.mode == 'reuse')) }}
    needs: [deb, rpm, appimage, key-writer, live-mode, live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Outil de signature
        run: cargo build --release -q -p secmet-attest --bin secmet-release

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemblage et noms publiés (convention GitHub, « ~ » → « . »)
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name 'secmet-live_*.tar' -o -name 'secmet-key_*.img.xz' \) -exec mv {} release/ \;
          for f in release/secmet_*~*_amd64.deb; do [ -f "$f" ] && mv "$f" "${f/\~/.}"; done
          ls -la release/

      - name: Version du tag et des sources
        id: version
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          test "$version" = "$cargo_version" || { echo "tag $tag ≠ Cargo.toml $cargo_version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Clé USB reprise de la release précédente (système inchangé)
        if: needs.live-mode.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SECMET_RELEASE_KEY: ${{ secrets.SECMET_RELEASE_KEY }}
          SECMET_RELEASE_BIN: ./target/release/secmet-release
          SECMET_RELEASES_URL: https://github.com/${{ github.repository }}/releases/download
          PREVIOUS: ${{ needs.live-mode.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$PREVIOUS" --repo "${{ github.repository }}" --dir previous \
            -p 'secmet-key_*_x86_64.img.xz' -p 'secmet-live_*_x86_64.tar' -p SHA256SUMS -p SHA256SUMS.sig -p latest.json
          ls -la previous/
          keyfile="$(mktemp)"
          printf '%s\n' "$SECMET_RELEASE_KEY" > "$keyfile"
          ./packaging/live/refresh_live.sh --previous previous --deb "release/secmet_${VERSION}.ubuntu24.04_amd64.deb" \
            --key "$keyfile" --trust "$SECMET_TRUST" --version "$VERSION" --out release
          rm -f "$keyfile"
          rm -rf previous
          ls -la release/

      - name: Signature (SHA256SUMS, latest.json) et vérification
        env:
          SECMET_RELEASE_KEY: ${{ secrets.SECMET_RELEASE_KEY }}
        run: |
          umask 077
          keyfile="$(mktemp)"
          printf '%s\n' "$SECMET_RELEASE_KEY" > "$keyfile"
          base="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          ./target/release/secmet-release sign release --key "$keyfile" \
            --version "${{ steps.version.outputs.version }}" --date "$(date -u +%F)" \
            --sums-url "$base/SHA256SUMS"
          rm -f "$keyfile"
          pubkey="$(python3 -c "import json;print(json.load(open('release/latest.json'))['public_key'])")"
          ./target/release/secmet-release verify release --trust "$pubkey"
          cat release/SHA256SUMS

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key_id="$(python3 -c "import json;print(json.load(open('release/latest.json'))['key_id'])")"
          v="${{ steps.version.outputs.version }}"
          {
            printf 'SecMet %s\n\nPaquets .deb, .rpm, AppImage, image de la clé USB prête à écrire (secmet-key_%s_x86_64.img.xz) et SecMet Clé USB pour l'écrire (secmet-key-writer_%s_x86_64.AppImage : vérifie la signature de l'image puis l'écrit sur la clé ; sinon Raspberry Pi Imager, Rufus ou dd, voir docs/Fabriquer_sa_cle.md) et livrable de fabrication (secmet-live_%s_x86_64.tar : image, secmet-make-key.sh, secmet-release).\nEmpreintes et notes signées : SHA256SUMS.sig, latest.json (clé de version %s).\n' \
              "$v" "$v" "$v" "$v" "$key_id"
            if [ "${{ needs.live-mode.outputs.mode }}" = reuse ]; then
              printf '\nClé USB : système repris tel quel de la release %s (aucun fichier du système de la clé modifié depuis) ; SecMet %s est dans le magasin app/%s de la partition de données et déployée au démarrage.\n' \
                "${{ needs.live-mode.outputs.previous }}" "$v" "$v"
            fi
          } > notes.md
          gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "SecMet ${{ steps.version.outputs.version }}" \
            --notes-file notes.md release/*
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
