name: Package

# Construit les livrables : .deb pour Ubuntu 24.04 et 22.04 (et dérivés :
# Mint 22 / 21), .rpm Fedora 44 et 42 (transition), AppImage (assemblée
# dans Ubuntu 24.04, avec secmet-verify et secmet-release), les binaires
# Linux autonomes secmet-verify_<v>_x86_64 et secmet-release_<v>_x86_64
# (construits avec le .deb Ubuntu 22.04), SecMet Clé USB (AppImage Linux et
# .exe Windows, runner windows-latest).
# Chaque paquet est installé et fumé dans son conteneur, à chaque push sur
# main et sur les pull requests touchant le packaging. Sur un tag vX.Y.Z
# (ou à la main avec ce tag), le dernier travail renomme les paquets selon
# la convention GitHub (« ~ » → « . »), signe SHA256SUMS et latest.json avec
# la clé de version, puis crée la release GitHub dans ce dépôt : en
# brouillon, avec exactement les fichiers de SHA256SUMS plus SHA256SUMS,
# SHA256SUMS.sig et latest.json, publiée une fois la liste vérifiée.
#
# Sur un tag ou à la main, la clé USB est publiée avec les paquets sous deux
# formes signées : le livrable de fabrication secmet-live_<version>_x86_64.tar
# (image, secmet-make-key.sh, secmet-release) et l'image prête à écrire
# secmet-key_<version>_x86_64.img.xz (Imager, Rufus, dd ;
# docs/Fabriquer_sa_cle.md). Deux cadences (packaging/live/live-mode.sh) :
#   - si un fichier du système de la clé a changé depuis la release
#     précédente, le travail « live » reconstruit l'image (conteneur
#     privilégié, 14 min) ;
#   - sinon « publish » reprend l'image de la release précédente (vérifiée
#     avec la clé de version) et refait seulement sa partition de données,
#     avec le nouveau .deb dans app/<version>/ signé : la clé le déploie au
#     démarrage (packaging/live/refresh_live.sh, quelques minutes).
#   full_live (à la main) impose la reconstruction (base Ubuntu rafraîchie).
#
# Secret : SECMET_RELEASE_KEY (clé de version Ed25519, 64 hex), rangé dans
# l'environnement GitHub « release » : seul le travail « publish », qui
# déclare cet environnement, peut le lire. Les autres travaux n'ont que la
# lecture du dépôt. Les journaux sont publics : aucune étape n'affiche le
# secret. Actions épinglées par empreinte de commit (étiquette en
# commentaire), pour qu'une étiquette déplacée ne change rien en silence.

on:
  push:
    branches: ["main"]
    # vX.Y.Z publie ; vX.Y.Z-rcN construit tout (paquets, image, .exe)
    # sans créer la release (répétition générale, Annexe N §N.9).
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]
  pull_request:
    branches: ["main"]
    paths:
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publier à nouveau un tag déjà poussé (ex. v0.3.6) ; vide : construction seule"
        required: false
        type: string
      full_live:
        description: "Reconstruire le système de la clé USB même s'il n'a pas changé"
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  SECMET_FORCE_BUILD: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Clé publique de version : ce que la clé USB (secmet-app-update) et
  # l'application acceptent ; sert à vérifier la release précédente reprise.
  SECMET_TRUST: bde3e3d9de271f8de9bb26c8dd4ed73f4c7344e309ebac7c3dffd50e02ca3bd5

permissions:
  contents: read

jobs:
  deb:
    name: .deb ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            version: "24.04"
          - distro: ubuntu22.04
            version: "22.04"
    steps:
      - name: Dépendances de construction
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git \
            libgtk-4-dev libglib2.0-dev policykit-1 testdisk \
            dpkg-dev fakeroot

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.distro }}

      - name: Construction du paquet
        env:
          SECMET_DEB_DISTRO: ${{ matrix.distro }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./packaging/build_deb.sh
          ls -la dist/

      - name: Installation et fumée
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y ./dist/secmet_*.deb
          dpkg -s secmet | grep -E '^(Version|Depends)'
          secmet-verify --help >/dev/null
          secmet-helper 2>/dev/null && exit 1 || test $? -eq 2
          test -x /usr/lib/secmet/bin/testdisk
          test -f /usr/share/polkit-1/actions/secmet.policy
          ./packaging/check-installed-docs.sh /usr/share/doc/secmet

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

      # Outils annexes publiés aussi comme binaires Linux autonomes, pris de
      # la construction Ubuntu 22.04 : la glibc la plus ancienne des cibles
      # (2.35), ils tournent donc sur toutes.
      - name: Binaires autonomes secmet-verify et secmet-release (fumée, glibc)
        if: matrix.distro == 'ubuntu22.04'
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          mkdir -p tools
          for t in secmet-verify secmet-release; do
            f="tools/${t}_${version}_x86_64"
            install -m 0755 "target/release/$t" "$f"
            "$f" --help > usage.txt
            head -1 usage.txt | grep -q "^usage: $t "
            max=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "$t : glibc max requise $max"
            test "$(printf '%s\n%s\n' "$max" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35
          done
          empty="$(mktemp -d)"
          if "tools/secmet-release_${version}_x86_64" verify "$empty"; then exit 1; fi
          ls -la tools/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.distro == 'ubuntu22.04'
        with:
          name: tools
          path: tools/*
          if-no-files-found: error

  rpm:
    name: .rpm Fedora ${{ matrix.version }}
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        # Fedora 44 : plus ancienne version maintenue (s'installe sur 44 et
        # 45). Fedora 42 en plus le temps de la transition : les SecMet
        # 0.4.0 cherchent secmet-<v>-1.fc42.x86_64.rpm pour se mettre à jour.
        version: ["42", "44"]
    steps:
      - name: Dépendances de construction
        run: |
          dnf install -y \
            gcc make pkgconf-pkg-config curl ca-certificates git \
            gtk4-devel glib2-devel polkit testdisk \
            rpm-build rpmdevtools

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: fedora${{ matrix.version }}

      - name: Construction du paquet
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./packaging/build_rpm.sh
          ls -la dist/

      - name: Installation et fumée
        run: |
          dnf install -y dist/secmet-*.rpm
          rpm -q secmet
          secmet-verify --help >/dev/null
          secmet-helper 2>/dev/null && exit 1 || test $? -eq 2
          test -x /usr/lib/secmet/bin/testdisk
          test -f /usr/share/polkit-1/actions/secmet.policy
          rpm -ql secmet | grep -qx /usr/share/doc/secmet/Annexes/README.md
          rpm -ql secmet | grep -qx /usr/share/doc/secmet/THIRD_PARTY_LICENSES.txt
          ./packaging/check-installed-docs.sh /usr/share/doc/secmet

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-fedora${{ matrix.version }}
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage (conteneur Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction (docker)
        run: |
          ./packaging/build_appimage.sh
          ls -la dist/

      # Binaires, outils annexes (usr/bin et aiguillage AppRun verify /
      # release), copyright de SecMet et de chaque bibliothèque embarquée.
      - name: Fumée (extraction sans FUSE, outils annexes, copyright, glibc requise)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/dist/SecMet_*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/secmet
          test -x squashfs-root/usr/bin/secmet-helper
          "$GITHUB_WORKSPACE"/packaging/appimage-smoke.sh squashfs-root
          max=$(objdump -T squashfs-root/usr/lib/libgtk-4.so.1 | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc max requise par libgtk-4 : $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  key-writer:
    name: SecMet Clé USB (AppImage, conteneur Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction (docker)
        run: |
          ./packaging/build_key_writer_appimage.sh
          ls -la dist/

      - name: Fumée (extraction sans FUSE, glibc requise, --version)
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/dist/secmet-key-writer_*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/secmet-key-writer
          max=$(objdump -T squashfs-root/usr/bin/secmet-key-writer | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "glibc max requise : $max"
          test "$(printf '%s\n%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39
          squashfs-root/usr/bin/secmet-key-writer --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: key-writer
          path: dist/secmet-key-writer_*.AppImage
          if-no-files-found: error

  key-writer-windows:
    name: SecMet Clé USB (.exe Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: key-writer-windows

      # Un seul exécutable, sans bibliothèque à côté (TLS Schannel, xz en
      # Rust pur). Sous-système « windows » : pas de console au lancement.
      - name: Construction
        shell: bash
        run: |
          cargo build --release -p secmet-key-writer
          version="$(grep -m1 '^version' crates/secmet-key-writer/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          mkdir -p dist
          cp target/release/secmet-key-writer.exe "dist/secmet-key-writer_${version}_x86_64.exe"
          ls -la dist/

      # Le runner a le runtime Visual C++ installé, pas un Windows neuf :
      # l'exécutable ne doit pas dépendre de VCRUNTIME*.dll ni MSVCP*.dll
      # (runtime lié en statique, .cargo/config.toml). Les api-ms-win-crt-*
      # font partie de Windows 10 et 11.
      - name: Aucune dépendance au runtime Visual C++
        shell: bash
        run: |
          for exe in dist/secmet-key-writer_*.exe; do
            if grep -a -i -o -E 'VCRUNTIME[0-9]+(_[0-9]+)?\.dll|MSVCP[0-9]+\.dll' "$exe" | sort -u | grep .; then
              echo "ERREUR: $exe dépend du runtime Visual C++ (DLL ci-dessus), absent d'un Windows neuf" >&2
              exit 1
            fi
          done
          echo "aucune DLL du runtime Visual C++ importée"

      - name: Fumée (--version, --list-disks)
        shell: bash
        run: |
          ./dist/secmet-key-writer_*.exe --version | tee version.txt
          grep -q "^secmet-key-writer " version.txt
          ./dist/secmet-key-writer_*.exe --list-disks

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: key-writer-windows
          path: dist/secmet-key-writer_*.exe
          if-no-files-found: error

  live-mode:
    name: Cadence de l'image de la clé USB
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      previous: ${{ steps.mode.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Système de la clé inchangé depuis la release précédente ?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          SECMET_RELEASES_REPO: ${{ github.repository }}
          # Construction seule (à la main sans tag) : rien à reprendre.
          SECMET_LIVE_FULL: ${{ (inputs.full_live || (github.event_name == 'workflow_dispatch' && inputs.tag == '')) && '1' || '0' }}
        run: |
          line="$(./packaging/live/live-mode.sh)"
          echo "$line"
          mode="${line#mode=}"; mode="${mode%% *}"
          previous="$(sed -n 's/.*previous=\(v[0-9.]*\).*/\1/p' <<<"$line")"
          { echo "mode=$mode"; echo "previous=$previous"; } >> "$GITHUB_OUTPUT"

  live:
    name: Image de la clé USB (conteneur privilégié)
    needs: live-mode
    if: needs.live-mode.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Place disque (outils inutiles du runner)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Construction de l'image (docker --privileged)
        env:
          SECMET_ENGINE: docker
        run: |
          ./packaging/live/build_live.sh
          cat dist/live/VERSION
          ls -la dist/live/

      - name: Livrable de la clé USB
        run: |
          ./packaging/live/bundle_live.sh
          tar -tf dist/secmet-live_*_x86_64.tar | grep -E 'filesystem.squashfs|secmet-make-key.sh|secmet-release$'

      - name: Script de mise à jour au démarrage (doublures)
        run: ./packaging/live/tests/app-update.sh

      - name: Image publiable de la clé (.img.xz, Imager / Rufus / dd)
        env:
          SECMET_ENGINE: docker
        run: |
          ./packaging/live/make_key_image.sh --dist
          ls -la dist/secmet-key_*_x86_64.img.xz
          xz -l dist/secmet-key_*_x86_64.img.xz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live
          path: |
            dist/secmet-live_*_x86_64.tar
            dist/secmet-key_*_x86_64.img.xz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Signature et release GitHub
    # « live » est sauté quand l'image est reprise : on attend chaque travail
    # explicitement plutôt que de laisser le saut se propager.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '') && !contains(inputs.tag || github.ref_name, '-rc') && needs.deb.result == 'success' && needs.rpm.result == 'success' && needs.appimage.result == 'success' && needs.key-writer.result == 'success' && needs.key-writer-windows.result == 'success' && needs.live-mode.result == 'success' && (needs.live.result == 'success' || (needs.live.result == 'skipped' && needs.live-mode.outputs.mode == 'reuse')) }}
    needs: [deb, rpm, appimage, key-writer, key-writer-windows, live-mode, live]
    runs-on: ubuntu-latest
    # Seul travail qui lit la clé de version et écrit la release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: publish

      - name: Outil de signature
        run: cargo build --release -q -p secmet-attest --bin secmet-release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Assemblage et noms publiés (convention GitHub, « ~ » → « . »)
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name 'secmet-key-writer_*.exe' -o -name 'secmet-live_*.tar' -o -name 'secmet-key_*.img.xz' -o -name 'secmet-verify_*_x86_64' -o -name 'secmet-release_*_x86_64' \) -exec mv {} release/ \;
          for f in release/secmet_*~*_amd64.deb; do [ -f "$f" ] && mv "$f" "${f/\~/.}"; done
          ls -la release/

      - name: Version du tag et des sources, notes du tag annoté
        id: version
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          test "$version" = "$cargo_version" || { echo "tag $tag ≠ Cargo.toml $cargo_version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Le corps du message du tag annoté (git tag -a) devient les notes
          # de la release et celles de latest.json ; un tag léger n'en a pas.
          git fetch --no-tags --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents:body)' "$tag" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > tag-notes.md
          else
            : > tag-notes.md
          fi
          echo "notes du tag : $(wc -l < tag-notes.md) ligne(s)"

      - name: Clé USB reprise de la release précédente (système inchangé)
        if: needs.live-mode.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SECMET_RELEASE_KEY: ${{ secrets.SECMET_RELEASE_KEY }}
          SECMET_RELEASE_BIN: ./target/release/secmet-release
          SECMET_RELEASES_URL: https://github.com/${{ github.repository }}/releases/download
          PREVIOUS: ${{ needs.live-mode.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$PREVIOUS" --repo "${{ github.repository }}" --dir previous \
            -p 'secmet-key_*_x86_64.img.xz' -p 'secmet-live_*_x86_64.tar' -p SHA256SUMS -p SHA256SUMS.sig -p latest.json
          ls -la previous/
          keyfile="$(mktemp)"
          printf '%s\n' "$SECMET_RELEASE_KEY" > "$keyfile"
          ./packaging/live/refresh_live.sh --previous previous --deb "release/secmet_${VERSION}.ubuntu24.04_amd64.deb" \
            --key "$keyfile" --trust "$SECMET_TRUST" --version "$VERSION" --out release
          rm -f "$keyfile"
          rm -rf previous
          ls -la release/

      - name: Signature (SHA256SUMS, latest.json) et vérification
        env:
          SECMET_RELEASE_KEY: ${{ secrets.SECMET_RELEASE_KEY }}
        run: |
          umask 077
          keyfile="$(mktemp)"
          printf '%s\n' "$SECMET_RELEASE_KEY" > "$keyfile"
          base="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          notes_args=()
          [ -s tag-notes.md ] && notes_args=(--notes-fr "$(cat tag-notes.md)")
          ./target/release/secmet-release sign release --key "$keyfile" \
            --version "${{ steps.version.outputs.version }}" --date "$(date -u +%F)" \
            --sums-url "$base/SHA256SUMS" "${notes_args[@]}"
          rm -f "$keyfile"
          # Vérification contre la clé publique attendue (SECMET_TRUST, celle
          # que les installations et SecMet Clé USB acceptent), jamais contre
          # celle du latest.json qu'on vient de produire : un secret recopié
          # avec une autre clé ferait sinon une release que personne n'accepte.
          pubkey="$(python3 -c "import json;print(json.load(open('release/latest.json'))['public_key'])")"
          if [ "$pubkey" != "$SECMET_TRUST" ]; then
            echo "::error::la clé du secret SECMET_RELEASE_KEY ne correspond pas à la clé de version attendue (clé publique $pubkey, attendue $SECMET_TRUST) : rien n'est publié"
            exit 1
          fi
          ./target/release/secmet-release verify release --trust "$SECMET_TRUST"
          cat release/SHA256SUMS

      # Ce qui est publié est exactement ce qui est signé : les fichiers de
      # SHA256SUMS (2e colonne) plus SHA256SUMS, SHA256SUMS.sig et
      # latest.json ; chacun des 11 livrables attendus doit y être.
      - name: Liste des fichiers publiés (tirée de SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v="$VERSION"
          for f in "secmet_${v}.ubuntu24.04_amd64.deb" "secmet_${v}.ubuntu22.04_amd64.deb" \
                   "secmet-${v}-1.fc44.x86_64.rpm" "secmet-${v}-1.fc42.x86_64.rpm" \
                   "SecMet_${v}_x86_64.AppImage" \
                   "secmet-key-writer_${v}_x86_64.AppImage" "secmet-key-writer_${v}_x86_64.exe" \
                   "secmet-verify_${v}_x86_64" "secmet-release_${v}_x86_64" \
                   "secmet-live_${v}_x86_64.tar" "secmet-key_${v}_x86_64.img.xz"; do
            grep -qx "[0-9a-f]\{64\}  $f" release/SHA256SUMS || { echo "livrable absent de SHA256SUMS : $f"; exit 1; }
          done
          { awk '{ sub(/^\*/, "", $2); print $2 }' release/SHA256SUMS; printf '%s\n' SHA256SUMS SHA256SUMS.sig latest.json; } | sort > assets.txt
          while read -r f; do test -f "release/$f" || { echo "absent de release/ : $f"; exit 1; }; done < assets.txt
          extra="$(comm -13 assets.txt <(ls release | sort))"
          [ -z "$extra" ] || echo "::warning::non signés, non publiés : $extra"
          echo "$(wc -l < assets.txt) fichiers à publier"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key_id="$(python3 -c "import json;print(json.load(open('release/latest.json'))['key_id'])")"
          v="${{ steps.version.outputs.version }}"
          {
            printf 'SecMet %s\n\n' "$v"
            if [ -s tag-notes.md ]; then cat tag-notes.md; printf '\n\n'; fi
            # Texte générique dans un heredoc : il contient des apostrophes.
            cat <<NOTES
          Paquets .deb, .rpm, AppImage, image de la clé USB prête à écrire (secmet-key_${v}_x86_64.img.xz) et SecMet Clé USB pour l'écrire (secmet-key-writer_${v}_x86_64.AppImage sous Linux, secmet-key-writer_${v}_x86_64.exe sous Windows : vérifie la signature de l'image puis l'écrit sur la clé et la relit ; sinon Raspberry Pi Imager, Rufus ou dd, voir docs/Fabriquer_sa_cle.md) et livrable de fabrication (secmet-live_${v}_x86_64.tar : image, secmet-make-key.sh, secmet-release).
          Fedora : secmet-${v}-1.fc44.x86_64.rpm (Fedora 44 et 45) ; secmet-${v}-1.fc42.x86_64.rpm reste publié le temps de la transition.
          Outils en ligne de commande, binaires Linux autonomes (chmod +x) : secmet-verify_${v}_x86_64 (certificats et manifestes de lot) et secmet-release_${v}_x86_64 (vérification d'une release) ; aussi dans l'AppImage (./SecMet_${v}_x86_64.AppImage verify …, … release …) et dans les paquets.
          Empreintes et notes signées : SHA256SUMS.sig, latest.json (clé de version ${key_id}).
          NOTES
            if [ "${{ needs.live-mode.outputs.mode }}" = reuse ]; then
              cat <<NOTES

          Clé USB : système repris tel quel de la release ${{ needs.live-mode.outputs.previous }} (aucun fichier du système de la clé modifié depuis) ; SecMet ${v} est dans le magasin app/${v} de la partition de données et déployée au démarrage.
          NOTES
            fi
          } > notes.md
          repo="${{ github.repository }}"
          # Brouillon resté d'une exécution interrompue : remplacé. Une
          # release publiée n'est jamais touchée.
          if draft="$(gh release view "$RELEASE_TAG" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || { echo "la release $RELEASE_TAG existe déjà"; exit 1; }
            gh release delete "$RELEASE_TAG" --repo "$repo" --yes
          fi
          # Brouillon d'abord, publié seulement si chaque fichier y est :
          # « latest » ne pointe jamais sur une release incomplète.
          mapfile -t files < <(sed 's|^|release/|' assets.txt)
          gh release create "$RELEASE_TAG" --repo "$repo" --title "SecMet $v" \
            --notes-file notes.md --draft "${files[@]}"
          gh release view "$RELEASE_TAG" --repo "$repo" --json assets --jq '.assets[].name' | sort > sent.txt
          if ! cmp -s assets.txt sent.txt; then
            echo "brouillon incomplet, laissé en brouillon :"; diff assets.txt sent.txt || true
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false
          echo "release $RELEASE_TAG publiée ($(wc -l < sent.txt) fichiers)"
