[package]
name = "secmet-helper"
version = "0.3.11"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
publish = false
description = "Helper privilégié SecMet : daemon sur socket Unix, sessions liées au disque, ouverture exclusive anti-TOCTOU, exécution des plans NIST."

[lib]
name = "secmet_helper"
path = "src/lib.rs"

[[bin]]
name = "secmet-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
secmet-device = { path = "../secmet-device" }
secmet-core = { path = "../secmet-core", features = ["device"] }

[dev-dependencies]
tempfile = "3"

# Même exigence que secmet-device : zéro unwrap/expect/panic en production,
# unsafe confiné à polkit.rs (getsockopt SO_PEERCRED, geteuid, umask) et documenté.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
