[package]
name = "secmet-device"
version = "0.3.9"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
publish = false
description = "Accès direct aux disques (SATA/SAS/USB-SAT via SG_IO, NVMe via ioctl admin, sysfs). Aucun outil externe."

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

# Zéro unwrap/expect en production, chaque bloc unsafe documenté.
# Les modules de test lèvent ces lints localement.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
