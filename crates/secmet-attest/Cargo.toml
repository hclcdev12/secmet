[package]
name = "secmet-attest"
version = "0.3.10"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
publish = false
description = "Certificats d'effacement SecMet : attestation JSON signée Ed25519, QR Base45, PDF natif sans Chromium."

[lib]
path = "src/lib.rs"

[[bin]]
name = "secmet-verify"
path = "src/bin/secmet-verify.rs"

[[bin]]
name = "secmet-release"
path = "src/bin/secmet-release.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["zeroize"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
