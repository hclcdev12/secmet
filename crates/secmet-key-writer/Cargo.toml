[package]
name = "secmet-key-writer"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.95"
publish = false
description = "SecMet Clé USB : écrit l'image de la clé SecMet sur une clé USB après vérification de la signature de la release (Linux, Windows)."

[[bin]]
name = "secmet-key-writer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Polices emoji monochromes embarquées (✔ ✖ de l'interface) : sans elles, egui
# ne dessine qu'un carré, aucune police système n'étant consultée.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
xz-native = "1"
secmet-attest = { path = "../secmet-attest" }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
dirs = "5.0"

# TLS : rustls (ring) sur Linux ; Schannel (native-tls) sur Windows, où
# ring exigerait un compilateur C.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# Rendu par wgpu sur Direct3D 12 plutôt qu'OpenGL : le pilote d'affichage
# de base de Windows (machines virtuelles, bureau à distance, postes sans
# pilote graphique) ne fournit qu'OpenGL 1.1, et Direct3D 12 a toujours
# le repli logiciel WARP. Seul le dorsal dx12 est compilé.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO",
    "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
