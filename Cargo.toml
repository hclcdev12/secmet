[workspace]
members = [".", "crates/secmet-helper", "crates/secmet-device", "crates/secmet-core", "crates/secmet-attest"]
default-members = [".", "crates/secmet-helper", "crates/secmet-device", "crates/secmet-core", "crates/secmet-attest"]
resolver = "2"
# Crate de fuzz (cargo-fuzz, nightly) : construite à part, voir fuzz/.
exclude = ["fuzz"]

[package]
name = "secmet"
version = "0.3.7"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "secmet"
path = "src/lib.rs"

[dependencies]
gtk4 = "0.9"
cairo-rs = "0.20"
glib = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
dirs = "5.0"
secmet-attest = { path = "crates/secmet-attest" }
secmet-helper = { path = "crates/secmet-helper" }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
sha2 = "0.10"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "secmet"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
